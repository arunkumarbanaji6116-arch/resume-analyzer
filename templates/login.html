<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · CareerForge AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><nav><a class="brand" href="/">CareerForge<span>AI</span></a></nav><main class="auth-card"><h1>Welcome back</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}<form action="/login" method="post"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button></form><hr><h2>New here?</h2><form action="/register" method="post"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="secondary">Create account</button></form></main></body></html>
