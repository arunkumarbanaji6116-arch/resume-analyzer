<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Results · CareerForge.AI · Career Development Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="//generativelanguage.googleapis.com">
  <link rel="preload" href="{{ url_for('static', filename='css/style.css') }}" as="style">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('careerforge_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
<body>
  <main class="auth-card">
    <h1>Practice complete</h1>
    <p>Return to the dashboard to continue building your career toolkit.</p>
    <a class="button" href="/dashboard">Back to dashboard</a>
  </main>
  <script src="{{ url_for('static', filename='js/spatial.js') }}"></script>
</body>
</html>
